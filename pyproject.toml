[project]
name = "weeing-weeing"
version = "0.1.0"
description = "배터리 트레이 이송 공정 설비 이상 대응 AI Agent (위잉위잉 캡스톤)"
readme = "README.md"
authors = [
    { name = "Laplace888", email = "stmdaks888@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.3.0",
    "chromadb>=1.5.9",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.1",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.4",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
weeing-weeing = "weeing_weeing.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
ml = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N"]
# 보안 룰: 하드코딩 비밀값(S105/S106), 요청 timeout 누락(S113),
# SQL 문자열 조립(S608). "외부 API에는 타임아웃" 팀 규칙을 린트로 강제한다.
extend-select = ["S105", "S106", "S113", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

