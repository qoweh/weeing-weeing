[project]
name = "weeing-weeing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laplace888", email = "stmdaks888@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.146.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pdfplumber>=0.11.10",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
weeing-weeing = "weeing_weeing.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
