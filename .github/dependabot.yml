# 의존성·이미지·액션 자동 갱신 PR(S4). 주 1회, dev로 올린다. 보안 패치는 주기와 무관하게 바로 온다.
# - cooldown: 새 버전이 나오고 며칠 지나야 올린다(갓 배포된 악성·불량 버전을 피한다).
# - 같은 종류는 한 PR로 묶어 리뷰·CI 횟수를 줄인다. 머지 전에 CI·리뷰를 거친다(자동 머지 없음).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: {interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}
    commit-message: {prefix: ci}

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule: {interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    groups:
      python-minor-patch: {update-types: [minor, patch]}
    commit-message: {prefix: chore}

  - package-ecosystem: npm
    directories: [/frontend, /hmi/web]
    target-branch: dev
    schedule: {interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: {update-types: [minor, patch]}
    commit-message: {prefix: chore}

  # Dockerfile FROM·compose image의 digest 고정(S5)을 최신으로 유지한다.
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule: {interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul}
    cooldown: {default-days: 7}
    groups:
      images: {patterns: ["*"]}
    commit-message: {prefix: chore}

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    target-branch: dev
    schedule: {interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul}
    cooldown: {default-days: 7}
    groups:
      compose-images: {patterns: ["*"]}
    commit-message: {prefix: chore}
