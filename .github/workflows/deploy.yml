name: Deploy (EC2)

# 이미지를 빌드해 GHCR에 올리고, 서버(EC2)에서 받아 교체한다. 절차·Secrets는 docs/DEPLOY.md.
# - main push(release PR 머지) 때 자동 실행. 수동 실행(Run workflow)도 main에서만 배포까지 간다.
# - 이미지 태그는 커밋 SHA. 롤백은 예전 실행의 Re-run jobs(같은 SHA를 다시 배포).
# - 서버는 빌드하지 않는다(메모리 8GB). GHCR 로그인은 이 실행의 GITHUB_TOKEN으로 하고 끝나면 로그아웃한다.
# - 서버 접속 정보는 Environment "production"의 Secrets·Variables에 있다. 그 Environment가 허용한
#   브랜치(main)에서만 deploy job이 값을 받는다. 다른 브랜치는 빌드까지만 되고 배포에서 막힌다(docs/DEPLOY.md).
# 액션은 태그 대신 커밋 SHA로 고정한다(ci.yml과 같은 규칙).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_only:
        description: 'API만 배포 (프론트엔드·웹·DB 컨테이너 유지)'
        type: boolean
        default: false
      web_only:
        description: 'Caddy만 배포 (API·프론트엔드·DB 유지, api_only와 동시 선택 금지)'
        type: boolean
        default: false

# job마다 필요한 권한만 준다. 서버로 넘기는 deploy job의 토큰은 이미지를 받기만 한다.
permissions:
  contents: read

# 배포는 겹치지 않게 차례로 돈다. 진행 중인 배포는 취소하지 않는다(서버가 반쯤 바뀐 채 멈추지 않게).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ inputs.api_only && fromJSON('["api"]') || inputs.web_only && fromJSON('["web"]') || fromJSON('["api", "frontend", "web"]') }}
    steps:
      - name: 배포 범위 확인
        env:
          API_ONLY: ${{ inputs.api_only && 'true' || 'false' }}
          WEB_ONLY: ${{ inputs.web_only && 'true' || 'false' }}
        run: |
          if [ "$API_ONLY" = true ] && [ "$WEB_ONLY" = true ]; then
            echo "::error::api_only와 web_only는 동시에 선택할 수 없습니다."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: 고정 ML 모델 다운로드·해시 검증
        if: matrix.image == 'api'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_ml_model.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          # 커밋 SHA 태그만 먼저 올린다. latest는 취약점 검사를 통과한 뒤에 붙인다.
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy 취약점 DB 캐시 키(날짜)
        id: trivy-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # 취약점 DB(수십 MB)를 매 실행 ghcr.io에서 받지 않는다(시간·요청 제한 회피). 날짜별 키라 하루 한 번
      # 새로 저장한다. 캐시가 오래됐으면 Trivy가 스스로 최신 DB를 받으므로 검사 기준은 그대로다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          restore-keys: trivy-db-
      - name: 취약점 검사 (Trivy, 수정판이 있는 CRITICAL이면 배포 중단)
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          NAME: ${{ matrix.image }}
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          # gitleaks처럼 바이너리를 해시로 검증해 받는다(외부 액션을 쓰지 않는다).
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          # HIGH까지는 기록만 남기고, 수정판이 나온 CRITICAL만 배포를 멈춘다.
          # --table-mode detailed: 취약점 0건인 파일까지 수백 줄 나열하는 요약표는 빼고, 발견된 것만 표로 남긴다.
          /tmp/trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format table --table-mode detailed --exit-code 0 --output /tmp/trivy.txt "$IMAGE"
          cat /tmp/trivy.txt
          # Job summary는 Markdown이라 표를 그대로 넣으면 줄이 합쳐져 선 문자가 뒤엉킨다. 코드 블록으로 감싼다.
          {
            echo "### 취약점 검사: ${NAME} (HIGH·CRITICAL, 수정판이 있는 것만)"
            if [ -s /tmp/trivy.txt ]; then
              echo '```text'; cat /tmp/trivy.txt; echo '```'
            else
              echo "발견된 취약점 없음"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          /tmp/trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL \
            --exit-code 1 "$IMAGE"
      - name: latest 태그 붙이기
        # latest = 마지막으로 배포한 이미지. 서버의 기본값이라 IMAGE_TAG가 없어도 최신이 뜬다.
        # 배포가 막히는 다른 브랜치의 수동 실행은 SHA 태그만 남기고 latest를 옮기지 않는다.
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # 사용자 이름은 비밀이 아니므로 Variable로 둔다(Secret이면 로그의 'ubuntu'가 모두 ***로 가려진다).
      EC2: ${{ vars.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: SSH 준비 (호스트 키를 고정해 다른 서버에 접속하지 않게 한다)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ "$EC2" = "ubuntu@" ] || [ "$EC2" = "@" ]; then
            echo "::error::Environment production에 EC2_HOST·EC2_SSH_KEY·EC2_KNOWN_HOSTS Secret이 필요합니다(docs/DEPLOY.md)"; exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config

      - name: 서버 접속 확인
        run: |
          # 접속 실패와 .env 없음을 나눠서 알린다.
          ssh "$EC2" true \
            || { echo "::error::서버에 SSH로 접속하지 못했습니다. 위 메시지가 Host key verification이면 EC2_KNOWN_HOSTS, Permission denied면 EC2_SSH_KEY, timed out이면 서버 전원·보안그룹 22번을 확인하세요(docs/DEPLOY.md)"; exit 1; }
          ssh "$EC2" 'mkdir -p ~/weeing-weeing && test -f ~/weeing-weeing/.env' \
            || { echo "::error::서버에 ~/weeing-weeing/.env가 없습니다(docs/DEPLOY.md 서버 .env)"; exit 1; }

      - name: compose 파일·.env.example 복사
        run: |
          scp deploy/docker-compose.prod.yml "$EC2":~/weeing-weeing/docker-compose.yml
          # .env 점검·보충용(ops/server.sh env-check·env-sync). .env 자체는 덮어쓰지 않는다.
          scp .env.example "$EC2":~/weeing-weeing/.env.example
          scp scripts/check_env.py "$EC2":~/weeing-weeing/check_env.py

      - name: 서버 .env에 빠진 키 추가
        run: |
          # .env.example에 있는데 서버 .env에 키가 아예 없는 줄만 끝에 덧붙인다. 값이 비었거나
          # 주석인 키는 그대로 둔다. 바꾸기 전 .env.bak을 남기고 추가한 키 이름만 출력한다.
          # 컨테이너를 바꾸기 전에 돌려 새 변수가 이번 배포부터 적용된다. 실패하면 여기서 멈춘다.
          ssh "$EC2" 'bash -s env-sync' < ops/server.sh

      - name: 이미지 받기·교체
        id: replace
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
          API_ONLY: ${{ inputs.api_only && 'true' || 'false' }}
          WEB_ONLY: ${{ inputs.web_only && 'true' || 'false' }}
          # Caddy만 배포할 때 확인하는 HTTPS 주소. Environment production의 Variable(docs/DEPLOY.md).
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: |
          if [ "$WEB_ONLY" = true ] && [ -z "$WEB_HEALTH_URL" ]; then
            echo "::error::Environment production에 Variable WEB_HEALTH_URL이 필요합니다(docs/DEPLOY.md)"; exit 1
          fi
          # 토큰은 명령줄이 아니라 표준 입력으로 넘긴다(서버 프로세스 목록에 남지 않게).
          printf '%s' "$TOKEN" | ssh "$EC2" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$EC2" "IMAGE_PREFIX='$IMAGE_PREFIX' TAG='$TAG' API_ONLY='$API_ONLY' WEB_HEALTH_URL='$WEB_HEALTH_URL' WEB_ONLY='$WEB_ONLY' bash -s" <<'EOF'
          set -euo pipefail
          # 어느 줄에서 실패해도 로그인 정보를 지운다(trap을 가장 먼저 건다).
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd ~/weeing-weeing
          if [ "$API_ONLY" = true ] || [ "$WEB_ONLY" = true ]; then
            service=api
            tag_key=API_IMAGE_TAG
            if [ "$WEB_ONLY" = true ]; then
              service=web
              tag_key=WEB_IMAGE_TAG
            fi
            # 웹용 IMAGE_TAG는 유지한다. rollback에 필요한 이전 API 태그를 별도 보존한다.
            previous=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q "$service")")
            previous_tag=${previous##*:}
            env "$tag_key=$TAG" docker compose pull --quiet "$service"
            sed -i "/^${tag_key}=/d" .env
            printf '\n%s=%s\n' "$tag_key" "$TAG" >> .env
            healthy=false
            if docker compose up -d --no-deps --wait --wait-timeout 150 "$service"; then
              healthy=true
              if [ "$service" = web ]; then
                healthy=false
                for attempt in $(seq 1 12); do
                  if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                    "$WEB_HEALTH_URL" >/dev/null 2>&1; then
                    healthy=true
                    break
                  fi
                  sleep 5
                done
              fi
            fi
            if [ "$service" = api ] && [ "$healthy" = true ]; then
              if ! docker compose exec -T api python scripts/check_ml_runtime.py; then
                healthy=false
              fi
            fi
            if [ "$healthy" = true ]; then
              printf '%s\n' "$previous" > ".${service}-previous-image"
              echo "$service 교체 완료. 다른 컨테이너와 기존 IMAGE_TAG 유지."
            else
              sed -i "/^${tag_key}=/d" .env
              printf '\n%s=%s\n' "$tag_key" "$previous_tag" >> .env
              docker compose up -d --no-deps --wait --wait-timeout 150 "$service"
              echo "::error::$service 배포 실패. 이전 이미지로 복원했습니다."
              exit 1
            fi
            exit 0
          fi
          # 실패 시 되돌릴 수 있게 지금 쓰는 태그를 남긴다(헬스체크 실패 → 이전 배포 복귀 단계).
          grep -E '^(IMAGE_PREFIX|IMAGE_TAG|API_IMAGE_TAG|WEB_IMAGE_TAG)=' .env > .deploy-previous-tags || true
          # 지금 배포한 태그를 .env에 남겨 서버 재시작·수동 up에서도 같은 이미지가 뜨게 한다.
          sed -i '/^IMAGE_TAG=/d;/^IMAGE_PREFIX=/d;/^API_IMAGE_TAG=/d;/^WEB_IMAGE_TAG=/d' .env
          # 마지막 줄에 줄바꿈이 없으면 덧붙인 값이 그 줄에 붙으므로 먼저 줄을 바꾼다.
          if [ -s .env ] && [ -n "$(tail -c1 .env)" ]; then echo >> .env; fi
          printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\nAPI_IMAGE_TAG=%s\nWEB_IMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$TAG" "$TAG" "$TAG" >> .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          # 이전 이미지는 헬스체크가 통과한 뒤에 지운다(실패하면 바로 되돌릴 수 있게).
          EOF

      - name: 헬스체크
        id: health
        run: |
          ssh "$EC2" bash -s <<'EOF'
          cd ~/weeing-weeing
          # api는 healthy, 나머지 서비스(web·frontend·postgres·qdrant)는 모두 running이어야 성공이다.
          total=$(docker compose config --services | wc -l)
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo none)
            running=$(docker compose ps --services --status running | wc -l)
            if [ "$status" = healthy ] && [ "$running" -eq "$total" ]; then
              docker compose ps --format 'table {{.Service}}\t{{.Status}}'
              echo "모든 서비스 정상 (api healthy, $running/$total running)"; exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          docker compose logs --tail 80
          echo "::error::150초 안에 정상이 되지 않았습니다 (api: $status, running: $running/$total)"; exit 1
          EOF

      - name: 이전 이미지 정리
        if: success() && !inputs.api_only && !inputs.web_only
        run: |
          # 실행 중인 컨테이너가 쓰지 않는 이미지는 모두 지운다. SHA 태그 이미지가 배포마다
          # 쌓이면 디스크 30GB가 금방 찬다. 이후 롤백은 GHCR에서 다시 받는다.
          ssh "$EC2" 'docker image prune -af >/dev/null; rm -f ~/weeing-weeing/.deploy-previous-tags'

      - name: 실패 시 이전 배포로 복귀
        # 전체 배포에서 교체(.env를 새 태그로 바꾼 뒤 pull·up 실패) 또는 헬스체크가 실패했을 때만.
        # API·Caddy만 배포는 교체 단계 안에서 이미 복원한다.
        if: >-
          failure() && !inputs.api_only && !inputs.web_only
          && (steps.replace.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | ssh "$EC2" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$EC2" bash -s <<'EOF'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd ~/weeing-weeing
          if [ ! -s .deploy-previous-tags ]; then
            echo "::error::되돌릴 이전 태그 기록이 없습니다(첫 배포). 서버에서 직접 확인하세요."; exit 1
          fi
          sed -i '/^IMAGE_TAG=/d;/^IMAGE_PREFIX=/d;/^API_IMAGE_TAG=/d;/^WEB_IMAGE_TAG=/d' .env
          if [ -s .env ] && [ -n "$(tail -c1 .env)" ]; then echo >> .env; fi
          cat .deploy-previous-tags >> .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans --wait --wait-timeout 150
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'
          echo "::error::새 배포의 교체 또는 헬스체크가 실패해 이전 이미지로 되돌렸습니다."
          EOF
          exit 1
