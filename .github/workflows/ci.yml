name: PR CI

# PR마다 도는 검사. 결정 근거는 docs/DECISIONS.md D-06.
# - main push에는 돌지 않는다. main은 release PR(merge commit)로만 바뀌고, 그 PR의 CI가 이미
#   "dev를 main에 합친 결과"를 검사했다(필수 검사). 머지 뒤 같은 내용을 다시 검사하지 않는다.
# - release PR(dev → main)은 합친 결과가 dev와 같으면 Lint·Test를 건너뛴다(dev에서 이미 검사함).
# - Lint·Test: 코드에 영향 있는 파일이 바뀐 PR만 실행. 문서만 바뀌면 건너뛴다(skipped = 통과로 취급).
# - Frontend·HMI web: frontend/·hmi/web/이 바뀐 PR만 타입·린트·빌드·테스트(Python 잡과 따로 판단).
# - Secret scan·Skills sync: 어떤 파일에든 생길 수 있는 문제라 항상 실행(각 10초 이내).
# 트리거 단계의 paths 필터 대신 잡 단위 if로 건너뛰는 이유: 워크플로 자체가 안 뜨면 필수 검사로
# 지정했을 때 PR이 "대기 중"으로 영원히 멈춘다. 잡이 skipped로 끝나면 그런 문제가 없다.
# 액션은 태그 대신 커밋 SHA로 고정한다(태그 바꿔치기 공급망 공격 방지).

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.detect.outputs.code }}
      make: ${{ steps.detect.outputs.make }}
      frontend: ${{ steps.detect.outputs.frontend }}
      hmi: ${{ steps.detect.outputs.hmi }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: 코드 영향 여부 판단 (불확실하면 실행 쪽으로)
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # PR이 아니면(수동 재실행 등) 전체 실행
          all_true='code=true\nmake=true\nfrontend=true\nhmi=true\n'
          if [ "$EVENT" != "pull_request" ]; then printf "$all_true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # release PR(dev → main)은 Lint·Test를 건너뛴다. dev에 들어온 PR은 모두 최신 dev 기준으로
          # 같은 검사를 통과했다(dev 규칙: 필수 검사 + 최신 상태 요구). 단, 합친 결과가 dev와 똑같을
          # 때만이다. main에만 있는 변경이 섞이면 처음 보는 조합이므로 전체 검사한다.
          # (워크플로는 그대로 떠야 한다. main 필수 검사가 skipped는 통과로, 안 뜬 검사는 대기로 본다.)
          # fork의 같은 이름 브랜치(dev)는 해당하지 않는다.
          if [ "$BASE_REF" = main ] && [ "$HEAD_REF" = dev ] && [ "$HEAD_REPO" = "$REPO" ]; then
            if git diff --quiet "$HEAD_SHA" HEAD; then
              echo "release PR: 합친 결과가 dev($HEAD_SHA)와 같아 Lint·Test 생략"
              printf 'code=false\nmake=false\nfrontend=false\nhmi=false\n' >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "release PR: main에만 있는 변경이 있어 전체 검사"
          fi
          # diff를 못 구하거나 비어 있으면 안전하게 전체 실행
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") || [ -z "$files" ]; then
            printf "$all_true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          make=false
          frontend=false
          hmi=false
          while IFS= read -r f; do
            case "$f" in
              # 코드·테스트에 영향 없는 파일. 여기 없는 경로는 전부 코드로 본다(새 폴더도 기본 검사).
              # frontend·hmi/web은 Node 앱이라 Python 테스트가 읽지 않는다. data/manuals는 테스트가 PDF를 읽어서 넣지 않는다.
              *.md|docs/*|.agents/skills/*|.claude/skills/*|data/knowledge/*|data/templates/*|.github/ISSUE_TEMPLATE/*|LICENSE|frontend/*|hmi/web/*) ;;
              *) code=true; echo "코드 영향: $f" ;;
            esac
            case "$f" in
              # Windows·Ubuntu make 호환 검사는 make 명령 경로가 바뀔 때만 돈다(Windows는 실행 시간 2배 과금).
              # make_help.py는 Windows 러너의 "make help" 단계에서만 실행된다.
              Makefile|scripts/run_make.py|scripts/make_help.py|tests/scripts/test_make_commands.py|pyproject.toml|uv.lock|.github/workflows/ci.yml) make=true ;;
            esac
            case "$f" in
              # Node 앱은 각자 폴더와 이 워크플로가 바뀔 때만 검사한다(deploy.yml이 둘 다 이미지로 빌드한다).
              frontend/*|.github/workflows/ci.yml) frontend=true ;;
            esac
            case "$f" in
              hmi/web/*|.github/workflows/ci.yml) hmi=true ;;
            esac
          done <<< "$files"
          printf 'code=%s\nmake=%s\nfrontend=%s\nhmi=%s\n' "$code" "$make" "$frontend" "$hmi" >> "$GITHUB_OUTPUT"
          echo "code=$code make=$make frontend=$frontend hmi=$hmi"

  lint:
    name: Lint (ruff)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # 린트는 dev 그룹(ruff)만 설치해 빠르게 끝낸다.
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .

  # 테스트를 러너 2개에 나눠 동시에 돌린다(PYTEST_SHARD, tests/conftest.py). 러너마다 설치·DB 준비가 따로 들어
  # Actions 사용 시간은 늘지만 기다리는 시간은 줄어든다. 필수 검사 이름 "Test (pytest)"는 아래 test 작업이 맡는다.
  test-shard:
    # 이름에 ${{ matrix.* }}를 넣으면 잡이 생략될 때 펼쳐지지 않은 식이 그대로 보인다.
    # 이름에서 빼면 GitHub이 "Test shard (1)"처럼 matrix 값을 뒤에 붙이고, 생략 때는 "Test shard"만 보인다.
    name: Test shard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DB 테스트(tests/db)를 SQLite와 함께 PostgreSQL에서도 돌린다(TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: weeing
          POSTGRES_PASSWORD: weeing
          POSTGRES_DB: weeing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weeing -d weeing_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://weeing:weeing@localhost:5432/weeing_test
      PYTEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-install-project --group ml
      # 러너 코어 수만큼 병렬(pytest-xdist). PostgreSQL 테스트는 작업자마다 DB를 따로 만든다(tests/db/conftest.py).
      # --durations로 느린 테스트를 로그에 남겨 다음 개선 대상을 본다.
      # auto는 psutil이 있으면 물리 코어 수라 2 vCPU 러너에서 작업자가 1개가 된다. logical로 vCPU 수만큼 띄운다.
      - run: echo "vCPU $(nproc)" && uv run --no-sync pytest -n logical --durations=15

  # 분할 결과를 하나로 모은 필수 검사. 변경 감지가 성공하고 분할이 모두 통과(또는 코드 변경이 없어 생략)해야 통과.
  # always()라서 변경 감지가 실패해도 이 작업이 실행되어 실패로 남는다(생략=통과로 새지 않게).
  test:
    name: Test (pytest)
    needs: [changes, test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "changes: $CHANGES, test-shard: $SHARDS"
          [ "$CHANGES" = success ] && { [ "$SHARDS" = success ] || [ "$SHARDS" = skipped ]; }

  make-compat:
    name: Make compatibility
    needs: changes
    if: needs.changes.outputs.make == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Windows GNU make 준비
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: make --version
      # 이 검사는 pytest·표준 라이브러리만 사용하므로 모델 패키지는 설치하지 않는다.
      - run: uv sync --locked --no-install-project --only-group dev
      - run: make help
      # 명령을 가짜 실행기로 받아 검사하므로 .env·DB·실제 LLM은 사용하지 않는다.
      - run: uv run --no-sync pytest tests/scripts/test_make_commands.py

  # Node 앱 2개. 운영 이미지(deploy/*.Dockerfile)와 같은 Node 24로 타입·린트·빌드·테스트를 한다.
  # package.json의 test:* 스크립트는 일부 파일만 고르므로 tests/ 아래 테스트 전체를 직접 지정한다.
  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --test 'tests/*.test.*'

  hmi:
    name: HMI web (Vite)
    needs: changes
    if: needs.changes.outputs.hmi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hmi/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hmi/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: node --test 'tests/*.test.js'

  skills:
    name: Skills sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # 표준 라이브러리만 쓰는 스크립트라 의존성 설치 없이 실행
      - run: python3 scripts/sync_skills.py --check

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: gitleaks (PR에 새로 들어온 커밋만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gl.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --redact -v --log-opts="${BASE_SHA}..${HEAD_SHA}"
