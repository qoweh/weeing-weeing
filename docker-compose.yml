# 로컬 개발용 보조 서비스. 앱(FastAPI·Streamlit)은 컨테이너 없이 uv run으로 띄운다.
#   DB만:          docker compose up -d postgres
#   Ollama까지:     docker compose --profile ollama up -d
#   Qdrant 서버:    docker compose --profile qdrant up -d qdrant  (.env에 QDRANT_URL=http://localhost:6333)
# macOS는 컨테이너 안에서 GPU(Metal)를 못 써서 Ollama가 느리다. Mac에서는 Ollama 앱을
# 직접 설치해 쓰고(OLLAMA_BASE_URL 기본값 그대로), 이 ollama 서비스는 Linux 서버용으로 쓴다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weeing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weeing}
      POSTGRES_DB: ${POSTGRES_DB:-weeing}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weeing} -d ${POSTGRES_DB:-weeing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  qdrant:
    # 클라이언트(qdrant-client 1.20)와 같은 minor 버전으로 고정한다. latest를 쓰지 않는다.
    image: qdrant/qdrant:v1.20.0
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  ollama_models:
  qdrant_data:
