# 로컬 개발용 보조 서비스. 앱(FastAPI·frontend·hmi/web)은 컨테이너 없이 띄운다(ops/local.sh).
#   DB만:          docker compose up -d postgres
#   Qdrant 서버:    docker compose --profile qdrant up -d qdrant  (.env에 QDRANT_URL=http://localhost:6333)
# LLM은 상용 API(Claude)를 쓰므로 LLM 컨테이너는 없다(docs/DIRECTION_CHANGES.md).

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weeing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weeing}
      POSTGRES_DB: ${POSTGRES_DB:-weeing}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weeing} -d ${POSTGRES_DB:-weeing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # 클라이언트(qdrant-client 1.20)와 같은 minor 버전으로 고정한다. latest를 쓰지 않는다.
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
