# 운영 서버(EC2)의 Langfuse(LLM 사용량 기록). 서버 ~/langfuse/에 이 파일과 .env를 두고 직접 띄운다(docs/DEPLOY.md).
# 2026-11-06부터 운영 Langfuse다. 홈서버 Langfuse의 hanwha-bootcamp 조직(프로젝트·사용자·API 키)을 그대로 옮겨 왔다.
#   docker compose up -d
# 앱(deploy/docker-compose.prod.yml)과 따로 둔다. 앱 배포 때 재시작되지 않고, 앱 없이도 켜고 끌 수 있다.
# langfuse-web만 앱 네트워크(weeing-weeing_default)에 붙어 Caddy(대시보드)와 api(기록 전송)가 이름으로 찾는다.
# 그래서 앱을 먼저 한 번 띄워 네트워크가 있어야 한다. 내부 서비스 이름에 langfuse- 를 붙여
# 앱의 postgres와 이름이 겹치지 않게 한다(같은 네트워크에서 이름이 겹치면 다른 DB로 붙을 수 있다).
# 공식 구성(github.com/langfuse/langfuse docker-compose.yml)에서 외부 포트를 모두 빼고 필요한 값만 남겼다.
# 이미지는 홈서버에서 옮긴 데이터를 만든 버전과 같게 고정한다. 더 낮은 버전으로 띄우면 DB 마이그레이션이
# 맞지 않는다. 올릴 때는 백업 후 Langfuse·ClickHouse 업그레이드 안내를 확인하고 한 번에 하나씩 올린다.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:?.env에 NEXTAUTH_URL 필요(https://langfuse.<EC2_IP>.sslip.io)}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres
  SALT: ${SALT:?.env에 SALT 필요}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?.env에 ENCRYPTION_KEY 필요(openssl rand -hex 32)}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?.env에 CLICKHOUSE_PASSWORD 필요}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD 필요}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  # 미디어 업로드는 쓰지 않는다(브라우저가 MinIO에 직접 올리는데, 보안그룹이 22·80·443만 연다).
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?.env에 REDIS_AUTH 필요}

x-depends: &depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.71.0
    restart: unless-stopped
    depends_on: *depends
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.71.0
    restart: unless-stopped
    depends_on: *depends
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?.env에 NEXTAUTH_SECRET 필요}
      # 네트워크가 둘이라 모든 주소에서 듣게 한다(기본값은 컨테이너 이름의 주소 하나뿐이라 앱 쪽에서 닿지 않는다).
      HOSTNAME: 0.0.0.0
      # 인터넷에 열려 있으므로 아무나 가입하지 못하게 막는다. 관리자 계정은 아래 INIT 값으로 처음 한 번 만든다.
      AUTH_DISABLE_SIGNUP: "true"
      # 빈 서버에 새로 설치할 때만 .env에 값을 넣는다. 처음 시작할 때 조직·프로젝트·API 키·관리자 계정을 만든다.
      # 옮겨 온 데이터가 있는 서버(지금 EC2)는 모두 비워 둔다. 값이 있으면 빈 조직이 하나 더 생긴다.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    networks:
      default:
      app:
        aliases: [langfuse-web]

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.11.4
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:22bf0ad174612a0106dfbbb95818f307525dd32c5a6ec119ecd7273815abe456
    restart: unless-stopped
    entrypoint: sh
    # 'langfuse' 버킷을 만든 뒤 시작한다(공식 구성과 같다).
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    image: docker.io/redis:7.4.11
    restart: unless-stopped
    command: --requirepass ${REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: docker.io/postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  # 앱 compose(프로젝트 이름 weeing-weeing)가 만든 기본 네트워크
  app:
    name: weeing-weeing_default
    external: true

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
