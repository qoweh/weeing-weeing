<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실시간 공정 화면</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #101720; }
      video { width: 100%; height: 100%; object-fit: cover; }
      #status { position: absolute; inset: 0; display: grid; place-items: center;
        color: white; font: 600 16px sans-serif; text-shadow: 0 1px 5px black;
        pointer-events: none; }
    </style>
    <script src="/cctv/reader.js"></script>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="status" role="status">영상 연결 중</div>
    <script>
      const video = document.getElementById("video");
      const status = document.getElementById("status");
      if (typeof MediaMTXWebRTCReader === "undefined") {
        status.textContent = "영상 중계기에 연결할 수 없습니다. 새로고침해 주세요.";
      } else {
        const reader = new MediaMTXWebRTCReader({
          url: new URL("/cctv/whep", window.location.origin).href,
          onError: () => { status.textContent = "영상 연결 대기 중 · 자동으로 다시 연결합니다."; },
          onTrack: (event) => {
            video.srcObject = event.streams[0];
            status.textContent = "";
          },
        });
        window.addEventListener("beforeunload", () => reader.close());
      }
    </script>
  </body>
</html>
