# 검토용 예시. 현재 관리형 세션의 권한을 자동 변경하지 않는다.
# 기존 sandbox_mode가 있으면 이 프로필보다 우선될 수 있다.
# default_permissions는 새 세션에서 호환성 검증 후 선택한다.

[permissions.weeing-local]
description = "Local tests with secret-bearing paths denied"
extends = ":workspace"

[permissions.weeing-local.network]
enabled = false

[permissions.weeing-local.filesystem]
glob_scan_max_depth = 8
"~/.aws" = "deny"
"~/.ssh" = "deny"

[permissions.weeing-local.filesystem.":workspace_roots"]
"**/.env*" = "deny"
"**/*.pem" = "deny"
"**/*.p12" = "deny"
"**/*.pfx" = "deny"
"**/.aws" = "deny"
"**/.ssh" = "deny"

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"*_KEY" = "exclude"
"*_TOKEN" = "exclude"
"*_SECRET" = "exclude"
"*_PASSWORD" = "exclude"
"AWS_*" = "exclude"
