
# Local Codex configuration. Contains no API keys.
# Select this profile in a new trusted-project session, then test the fake canary.
# Older sandbox_mode settings in other config layers can override this selection.

# Paths are repo-relative (":workspace_roots"), so any clone location works
# on macOS and Windows.
default_permissions = "weeing-secret-guard"

[windows]
# Windows only; macOS and Linux ignore this table.
# Provisioning this backend requires administrator approval.
sandbox = "elevated"

[permissions.weeing-secret-guard]
description = "Workspace edits with environment-file reads denied"
extends = ":workspace"

[permissions.weeing-secret-guard.filesystem]
# Expand deny globs before sandboxed processes start.
glob_scan_max_depth = 8

# Preserve existing absolute-path protections.
"C:/weeing-weeing/.env" = "deny"
"C:/weeing-weeing/.env.canary" = "deny"

[permissions.weeing-secret-guard.filesystem.":workspace_roots"]
# Protect environment files in workspace roots.
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.weeing-secret-guard.network]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"*_KEY" = "exclude"
"*_TOKEN" = "exclude"
"*_SECRET" = "exclude"
"*_PASSWORD" = "exclude"
"AWS_*" = "exclude"
