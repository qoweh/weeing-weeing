# RAG E2E 검증용 샘플 질의(#28). scripts/verify_rag_e2e.py가 읽는다.
# 정답은 청크 ID가 아니라 "기대 문서 + 기대 키워드"로 판정한다. 청크 ID는 #6의 청킹 방식에 따라 달라지기 때문이다.
#   hit: 상위 k개 안에 doc_id가 같고, 본문에 any_of 키워드 중 하나라도 있는 청크가 있다
#   where(선택): 저장소 필터. 예: { doc_type = "sop" }
#   expect_no_evidence = true: 근거 없음이 정답. doc_id·any_of는 쓰지 않는다.
# 순위 지표는 정답 질의만, 범위 밖 질의는 빈 결과 반환 여부로 별도 집계한다.
#   codes(query 대신): Incident 코드. 질의문은 rag.query.codes_query로 만든다(#8). 정답 키워드는 코드 목록 표가 아니라
#   대응 절 본문에만 있는 문구로 정한다(표에도 코드 문자열이 있어 코드만으로는 표가 정답으로 잡힌다).
# 키워드는 data/parsed/*.md에서 해당 문서에 실제로 있는지 확인했다.
# #8 평가셋(질문 + 정답 청크)이 생기면 그것으로 바꾸거나 함께 쓴다.

[[queries]]
id = "q01"
query = "입구 센서가 계속 감지 상태로 남아 있다. 어떻게 대응하나"
doc_id = "BTT-MANUAL"
any_of = ["감지면 오염", "센서 앞 물체 유무"]

[[queries]]
id = "q02"
query = "트레이가 출구에 늦게 도착하거나 나오지 않는다"
