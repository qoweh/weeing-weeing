text = "05 공급전압·외함 온도 대응\n\n| 코드 | 수치 기준 | 확인·조치 |\n| --- | --- | --- |\n| BTT2-M07 저전압 | A하한 20.0 V / B 18.0 V | 전원 출력과 드라이버 입력 측정값 비교, 부하 시 전압 강하·접속·배선· 전원 용량 조사. 전기 담당자가 정격과 측정 위치를 먼저 확인. [R2] |\n| BTT2-M08 과전압 | A상한 25.0 V / C 27.0 V | 전원 설정·실측 확인, 감속·정지 시점과 연관성 조사. 회생 처리·가감속 조건은 실제 제품 매뉴얼에 따라 검토. 임의 저항 추가 금지. [R2] |\n| BTT2-M09 외함 저온 | A하한 45℃ / B 40℃ | 예열·주변 온도·센서 접촉·설치 위치·스케일 확인. 10분 예열 후 평가를 초기안으로 사용하며 저온 자체를 모터 손상으로 해석하지 않음. |\n| BTT2-M10 외함 고온 | A상한 85℃ / C 90℃ | 접근·접촉 위험 통제, 온도 실측·위치 대조 후 부하·방열·주변 온도·기계 마찰 점검. 실제 제품 허용 외함 온도 확인. 외함값으로 권선·드라이버 온도 추정 금지. [R2] |\n\n시간·해제\n전압 Warning/Error는 1초 지속, 외함 온도는 10초 지속으로 확정한다. 둘 다 A 범위 안 10초 후 관측 회복이다. 제조사\n자체 보호 알람이 동작했다면 해당 알람의 해제 조건을 추가로 만족해야 한다. 보호 알람은 본 문서의 회복 타이머만으\n로 해제하지 않는다.\n제품 사양과의 관계\n18/27 V와 40/90℃는 사용자 제공 후보 경계다. 예를 들어 참고한 BLV 매뉴얼의 보호 한도는 모델에 따라 다르다. 이 값\n들을 실제 선정 드라이버의 저전압·과전압 보호 한도라고 표기하지 않는다. 실제 모델·전원·측정 위치를 확인한 뒤 승인\n설정으로 관리한다. [R2]\n\n> 현재 지정본의 외함 온도 65.0℃는 정상 범위 중앙값이다. 지정값이 일정하다는 사실로 열적 안정성·방열 성능·센서 건전성을 입증할 수 없다. 온도·전류 이상 시험은 별도의 표시된 시험 데이터 또는 검증된 실측으로 수행한다."

