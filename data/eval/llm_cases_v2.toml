incident = "평가용 합성 사건 BTT2-P01. RUN=true, 정상 정지·정비 상태가 아님. 이송시간 초과. 추적 중인 트레이가 17초 동안 출구에서 검출되지 않아 Error로 접수됐다. 센서 고장인지 실제 정체인지 미확인이다."
