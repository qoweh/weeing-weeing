# #106 LLM 고정 근거 32사례. 합성 사건이며 실제 Detector 시험이 아니다.
# 8코드 × correct/mixed/unrelated/none. 문서 페이지를 수정 없이 사용한다.
# 평가 전용 ID는 실제 RAG 청크 ID가 아니다. 정답 ID 대조는 의미 검증을 대체하지 않는다.

