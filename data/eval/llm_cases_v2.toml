text = "04 기동·속도·DC 입력전류 대응\n\n| 코드 | 의미·판정 | 확인·조치 |\n| --- | --- | --- |\n| BTT2-M01 | RUN 후 3초 미도달 또는 운전 중 rpm<=100이 3초 지속 | 정상 정지 요구 여부 → 전원·드라이버 실제 알람 → 모터 신호· 동력 연결 → 기계 구속 순서. 원인 제거 전 반복 리셋 금지. [R2] |\n| BTT2-M02 | RPM 저하 / B=990, A하한=1000 | 목표속도·기동 유예·부하·전압·실제 회전 측정 비교. 마찰·전달 부 문제를 점검. |\n| BTT2-M03 | RPM 과다 / A상한=1030, C=1040 | 잘못된 레시피·설정값·RPM 펄스 환산·계측축 확인. 실제 과속 인지 독립 측정으로 확인 후 설정 수정. |\n| BTT2-M04 | 속도 불안정 / 20초 범위>30 Warning, >60 Error | 명령 변경·하중 변화·피드백 품질·전원 변동을 시각 정렬해 대 조. 기동·감속 구간 제외. |\n| BTT2-M05 | DC 입력전류 감소 / B=0.080967 A | 무부하·동력 분리·센서 스케일·배선·영점 확인. 낮은 전류 단독 으로 모터 고장 판정 금지. |\n| BTT2-M06 | DC 입력전류 증가 / C=0.103165 A | 동일 속도·적재 기준으로 간섭·과적재·벨트 장력·베어링/전달부 저항 후보 조사. 실제 드라이버 과부하 알람도 별도 확인. |\n\n공통 수치 범위와 시간\nRPM A=1000~1030, 전류 A=0.089963~0.093786 A. A와 B/C 사이가 Warning, B 이하·C 이상이 Error 후보다.\nM02~M06은 유효 운전 문맥 및 같은 조건에서 3초 지속 후 확정하고 A 안 10초 후 회복한다. M01은 기동 성공 후 관측\n회복하되 재기동 자체는 책임자 승인 절차를 따른다.\n\n> DC 입력전류는 드라이버에 들어가는 전류다. 모터 상전류·정격 토크·드라이버 보호 검출값과 동일하지 않다. 현재 지 정본의 0.0918745 A는 정상 구간 시연값이므로 실제 부하를 보여주지 않는다.\n\n복구 확인: 설정·명령이 올바르고 실제 회전이 일치하는지 확인한다. 무부하와 정상 적재 시험을 구분해 기록하고, 같은\n고장이 반복되면 원래 드라이버 알람과 전원·파형 자료를 보전 담당자에게 전달한다."

