[[cases.evidence]]
evidence_id = "EVAL-DISTRACTOR:2.0:p07-P01"
doc_id = "BTT-MANUAL"
doc_version = "2.0"
citation = "BTT-MANUAL 2.0 PDF 7쪽 (고정 평가 발췌)"
text = "06 진동·충격·특정 측 변화 대응\n\n| 코드 하/상 | 데이터 / A 범위 | B / C |\n| --- | --- | --- |\n| BTT2-M11 / M12 | DE RMS / 0.040396~0.080601 g | 0.036356 / 0.088661 g |\n| BTT2-M13 / M14 | DE 첨도 / 3.5511~7.0661 | 2.8836 / 7.7727 |\n| BTT2-M15 / M16 | NDE RMS / 0.049179~0.062322 g | 0.044261 / 0.068554 g |\n| BTT2-M17 / M18 | NDE 첨도 / 3.3565~5.4770 | 2.7413 / 6.0248 |\n| BTT2-M19 | 자기 정상 RMS 기준 대비 한쪽 변화 | 한쪽>1.25 / >1.50배, 반대쪽<=1.10배 |\n\nRMS 상한 - M12 / M16\n같은 속도·하중과 센서 장착인지 확인한다. 보전 담당자는 체결·정렬·벨트/전달부·접촉 여부를 조사하고, 필요 시 원시 파\n형·주파수/엔벨로프 분석으로 원인을 구분한다. 높은 전체 진동은 추가 분석의 출발점이며 베어링 교환의 단독 근거가\n아니다. [R3]\n첨도 상한 - M14 / M18\n트레이 투입시각과 충격이 겹치는지, 파형 포화·비정상 피크·특징 계산 창이 바뀌었는지 확인한다. 반복 충격이 남으면\n국부 접촉·베어링 후보를 추가 분석한다. 첨도 수치만으로 손상 위치·심도를 확정하지 않는다.\n하한 - M11 / M13 / M15 / M17\n장착 풀림·센서 분리·감도·필터·데이터 경로와 Pearson/초과첨도 정의를 확인한다. 낮은 진동·첨도는 정상 상태의 변화일\n수도 있으므로 설정 범위 이탈로 표시하고 원인을 별도 판별한다.\n한쪽 변화 - M19\nDE와 NDE의 절대 크기를 직접 비교하지 않는다. 동일 조건의 각자 정상 중앙값 대비 비율을 사용한다. 기준 미확보이면\nUnknown이다. 한쪽 기준 비율만 1.25배(Warning) 또는 1.50배(Error)를 넘고 반대쪽이 1.10배 이하인 상태가 10초일 때\n발생하며, 두 쪽 모두 1.10배 이하 10초면 회복한다. 숫자는 설계 제안이다.\nM11~M18은 3초 지속 후 확정, A 안 10초 후 회복. 센서 재부착·교환·대역 변경 시 이전 기준으로 자동 회복·정상화하지\n말고 기준을 재검증한다."

