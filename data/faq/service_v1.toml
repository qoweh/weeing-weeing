[[faqs]]
faq_id = "FAQ-CONTACT-002"
faq_version = "3"
topic_id = "contacts"
question = "보고서 작성·제출 문제는 누구에게 문의하나요?"
order = 20
active = true
answer = "보고서 작성·제출의 업무 담당은 현장 점검자입니다. 해당 보고서 작성자에게 입력 내용과 제출 상태를 먼저 확인하고, 검토 단계의 업무 내용은 보전 팀장에게 확인하세요. 다른 사용자가 작성한 보고서는 열람할 수 있지만 임의로 수정·제출할 수는 없습니다. 작성·수정 권한 문제는 계정 관리자에게 직책 확인을 요청하세요."
reviewed_at = 2026-10-29
references = ["docs/AUTH.md#직책별-권한표-제안-미확정", "docs/REPORTS.md#흐름", "src/weeing_weeing/db/reports.py:_owner", "src/weeing_weeing/db/reports.py:transition"]

[[faqs]]
faq_id = "FAQ-CONTACT-003"
faq_version = "2"
topic_id = "contacts"
question = "검토·최종 결재 진행은 누구에게 문의하나요?"
order = 30
active = true
answer = "제출된 보고서의 검토 업무는 보전 팀장, 검토 승인된 보고서의 최종 승인 업무는 관제 담당자에게 확인하세요. 현재 보고서 상태가 제출됨이면 보전 팀장 검토 단계이고, 검토 승인이면 관제 담당자 최종 승인 단계입니다."
reviewed_at = 2026-10-29
references = ["docs/AUTH.md#직책별-권한표-제안-미확정", "docs/REPORTS.md#흐름", "src/weeing_weeing/db/reports.py:transition"]
