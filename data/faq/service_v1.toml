[[faqs]]
faq_id = "FAQ-ACCESS-001"
faq_version = "2"
topic_id = "access"
question = "기능이나 메뉴에 접근이 안돼요."
order = 10
active = true
answer = "로그인이 만료됐다는 안내가 나오면 다시 로그인하세요. 문서 조회는 직책과 무관하게 가능합니다. 작성·수정·결재 기능에서 권한이 없다는 안내가 나오면 해당 업무의 직책과 작성자 조건을 확인하세요. DB 연결 실패나 서비스 장애 안내가 나오면 시스템 관리자에게 별도 문의 부탁드립니다."
reviewed_at = 2026-10-29
references = ["docs/AUTH.md#로그인과-권한", "src/weeing_weeing/api/auth.py:current_user", "src/weeing_weeing/api/auth.py:require_roles"]

[[faqs]]
faq_id = "FAQ-ACCESS-002"
faq_version = "2"
topic_id = "access"
question = "보고서에 접근이 안돼요."
order = 20
active = true
answer = "로그인한 사용자는 직책이나 작성자 여부와 관계없이 보고서를 조회할 수 있습니다. 초안·반려·승인 상태와 과거 버전도 열람할 수 있습니다. 보고서가 열리지 않으면 보고서 ID·버전이 맞는지와 표시된 오류를 확인하세요. 보고서 없음이나 서비스 장애는 직책별 조회 권한 문제와 다릅니다. 조회가 가능해도 다른 사람의 보고서를 수정·제출·결재할 권한이 생기는 것은 아닙니다."
reviewed_at = 2026-10-29
references = ["docs/AUTH.md#문서-공통-열람", "docs/REPORTS.md#API", "src/weeing_weeing/db/reports.py:get_report"]

[[faqs]]
faq_id = "FAQ-REPORT-001"
faq_version = "1"
topic_id = "reports"
question = "보고서를 제출하려면 어떤 내용을 작성해야 하나요?"
order = 10
active = true
answer = "현장 점검자인 작성자가 저장된 사건을 연결하고, 실제 수행 내용 또는 미수행 사유, 확인 원인 또는 미확인 사유, 복구 시험 내용·결과 또는 미실시 사유를 작성해야 합니다. 조치를 수행했다면 조치 시각도 필요합니다. 정지시간을 입력할 때는 정지 시작과 운전 복귀 시각을 함께 입력하세요. 제출 전 입력을 저장하고 제출하면 보전 팀장의 검토 단계로 넘어갑니다."
reviewed_at = 2026-10-29
references = ["docs/REPORTS.md#흐름", "src/weeing_weeing/db/reports.py:_submitted_report"]

[[faqs]]
faq_id = "FAQ-REPORT-002"
faq_version = "1"
topic_id = "reports"
question = "제출한 보고서를 수정할 수 있나요?"
order = 20
active = true
answer = "제출된 판의 입력 내용은 고정되어 바로 수정할 수 없습니다. 반려되거나 최종 승인된 보고서는 작성자가 새 개정판을 만들어 수정할 수 있습니다. 새 개정판을 만들어도 이전 판의 내용과 결재 이력은 보존됩니다. 제출 또는 검토 승인 상태에서는 새 개정판을 만들 수 없습니다."
reviewed_at = 2026-10-29
references = ["docs/REPORTS.md#흐름", "src/weeing_weeing/db/reports.py:revise"]

[[faqs]]
faq_id = "FAQ-APPROVAL-001"
faq_version = "1"
topic_id = "approval"
question = "보고서는 어떤 순서로 승인되나요?"
order = 10
active = true
answer = "현장 점검자가 보고서를 작성·제출하면 보전 팀장이 검토 승인하고, 이후 관제 담당자가 최종 승인합니다. 제출·검토 단계에서는 사유를 적어 반려할 수 있습니다."
reviewed_at = 2026-10-29
references = ["docs/REPORTS.md#흐름", "src/weeing_weeing/db/reports.py:transition"]

